name: Deploy Space
concurrency:
  group: deploy-space
  cancel-in-progress: true

on:
  push:
    branches:
      - ARIS-SPACE-BACK

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth, media, user, post, chat, support, community, search, game, indexer]
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.sha }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          docker buildx build \
            --cache-from "type=registry,ref=ghcr.io/${owner}/aris-${{ matrix.service }}:space" \
            --cache-to "type=inline" \
            --push \
            -t "ghcr.io/${owner}/aris-${{ matrix.service }}:${TAG}" \
            -t "ghcr.io/${owner}/aris-${{ matrix.service }}:space" \
            -f "services/${{ matrix.service }}/Dockerfile" \
            .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SPACE_DEPLOY_HOST }}
          username: ${{ secrets.SPACE_DEPLOY_USER }}
          key: ${{ secrets.SPACE_DEPLOY_SSH_KEY }}
          command_timeout: 10m
          envs: IMAGE_TAG,GHCR_TOKEN,GHCR_ACTOR
          script: |
            set -euo pipefail
            cd ${{ secrets.SPACE_DEPLOY_PATH }}
            git fetch origin
            git switch -f -C ARIS-SPACE-BACK origin/ARIS-SPACE-BACK
            sh scripts/deploy-remote.sh
