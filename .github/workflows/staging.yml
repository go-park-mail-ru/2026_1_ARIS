name: Deploy Staging

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_DEPLOY_HOST }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail

            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            git fetch origin
            git reset --hard origin/dev

            set -a
            . ./.env.server
            set +a
            sh scripts/render-nginx-server-conf.sh

            docker compose --env-file ./.env.server \
              -f ./docker-compose.dev.yml \
              -f ./docker-compose.server.yml \
              --profile microservices \
              up --build --force-recreate -d \
              auth media user post chat support community search nginx

            sleep 15
            docker ps --format '{{.Names}} {{.Status}}' | grep 'arisback-nginx-1 .*healthy'
            curl --fail --silent --show-error https://arisnet.online/api/public/feed?limit=1 >/dev/null
