name: Deploy Production

on:
  push:
    branches:
      - main
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_DEPLOY_HOST }}
          username: ${{ secrets.PROD_DEPLOY_USER }}
          key: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            cd ${{ secrets.PROD_DEPLOY_PATH }}
            git fetch origin
            git switch -f -C "${{ github.ref_name }}" "origin/${{ github.ref_name }}"
            sh scripts/deploy-remote.sh
