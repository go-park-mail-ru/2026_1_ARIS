services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - aris_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
    ports:
      - "127.0.0.1:${MINIO_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - aris_minio_data:/data

  migrate:
    image: golang:alpine
    working_dir: /workspace/arisback
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SSL_MODE: disable
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/workspace/arisback
      - aris_go_bin:/go/bin
      - aris_go_pkg:/go/pkg
      - aris_go_build:/root/.cache/go-build
    command: >
      sh -c "
      apk add --no-cache git ca-certificates postgresql-client &&
      sh /workspace/arisback/scripts/dev-migrate.sh
      "

  seed:
    image: golang:alpine
    working_dir: /workspace/arisback
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SSL_MODE: disable
      POOL_MAX_CONNS: ${POOL_MAX_CONNS}
      POOL_MAX_CONN_LIFETIME: ${POOL_MAX_CONN_LIFETIME}
      POOL_MAX_CONN_IDLE_TIME: ${POOL_MAX_CONN_IDLE_TIME}
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    volumes:
      - .:/workspace/arisback
      - aris_go_pkg:/go/pkg
      - aris_go_build:/root/.cache/go-build
    command: >
      sh -c "
      apk add --no-cache git &&
      go mod download &&
      go run ./cmd/seed
      "

  redis:
    image: redis:latest
    restart: unless-stopped
    container_name: ${REDIS_CONTAINER_NAME}
    command: ["redis-server", "--requirepass", "${REDIS_USER_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_USER_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PUBLIC_PORT}:6379"
    volumes:
      - aris_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_USER_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  auth:
    profiles: ["microservices"]
    image: golang:alpine
    restart: unless-stopped
    working_dir: /workspace/arisback
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SSL_MODE: disable
      POOL_MAX_CONNS: ${POOL_MAX_CONNS}
      POOL_MAX_CONN_LIFETIME: ${POOL_MAX_CONN_LIFETIME}
      POOL_MAX_CONN_IDLE_TIME: ${POOL_MAX_CONN_IDLE_TIME}
      REDIS_DB: ${REDIS_DB}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD}
      REDIS_MAX_RETRIES: ${REDIS_MAX_RETRIES}
      REDIS_DIAL_TIMEOUT: ${REDIS_DIAL_TIMEOUT}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT}
      REDIS_ADDR: redis:6379
      MEDIA_GRPC_ADDR: media:8003
      SUPPORT_GRPC_ADDR: support:${SUPPORT_GRPC_PORT}
      AUTH_GRPC_PORT: ${AUTH_GRPC_PORT}
      AUTH_HTTP_PORT: ${AUTH_HTTP_PORT}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      support:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${AUTH_GRPC_PORT} && nc -z 127.0.0.1 ${AUTH_HTTP_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${AUTH_GRPC_PORT}:${AUTH_GRPC_PORT}"
      - "127.0.0.1:${AUTH_HTTP_PORT}:${AUTH_HTTP_PORT}"
    volumes:
      - .:/workspace/arisback
      - aris_go_pkg:/go/pkg
      - aris_go_build:/root/.cache/go-build
    command: >
      sh -c "
      apk add --no-cache git netcat-openbsd &&
      go mod download &&
      go run ./cmd/auth
      "

  media:
    profiles: ["microservices"]
    image: golang:alpine
    restart: unless-stopped
    working_dir: /workspace/arisback
    environment:
      APP_ENDPOINT: ${APP_ENDPOINT}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SSL_MODE: disable
      POOL_MAX_CONNS: ${POOL_MAX_CONNS}
      POOL_MAX_CONN_LIFETIME: ${POOL_MAX_CONN_LIFETIME}
      POOL_MAX_CONN_IDLE_TIME: ${POOL_MAX_CONN_IDLE_TIME}
      MINIO_PORT: "9000"
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: "false"
      REDIS_DB: ${REDIS_DB}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD}
      REDIS_MAX_RETRIES: ${REDIS_MAX_RETRIES}
      REDIS_DIAL_TIMEOUT: ${REDIS_DIAL_TIMEOUT}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT}
      REDIS_ADDR: redis:6379
      USER_GRPC_ADDR: user:8004
      MEDIA_GRPC_PORT: "8003"
      MEDIA_HTTP_PORT: "8081"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081 && nc -z 127.0.0.1 8003"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:8003:8003"
      - "127.0.0.1:8081:8081"
    volumes:
      - .:/workspace/arisback
      - aris_go_pkg:/go/pkg
      - aris_go_build:/root/.cache/go-build
    command: >
      sh -c "
      apk add --no-cache git netcat-openbsd &&
      go mod download &&
      go run ./cmd/media
      "

  user:
    profiles: ["microservices"]
    image: golang:alpine
    restart: unless-stopped
    working_dir: /workspace/arisback
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SSL_MODE: disable
      POOL_MAX_CONNS: ${POOL_MAX_CONNS}
      POOL_MAX_CONN_LIFETIME: ${POOL_MAX_CONN_LIFETIME}
      POOL_MAX_CONN_IDLE_TIME: ${POOL_MAX_CONN_IDLE_TIME}
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: "false"
      REDIS_DB: ${REDIS_DB}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD}
      REDIS_MAX_RETRIES: ${REDIS_MAX_RETRIES}
      REDIS_DIAL_TIMEOUT: ${REDIS_DIAL_TIMEOUT}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT}
      REDIS_ADDR: redis:6379
      MEDIA_GRPC_ADDR: media:8003
      USER_GRPC_PORT: "8004"
      USER_HTTP_PORT: "8082"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8082 && nc -z 127.0.0.1 8004"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:8004:8004"
      - "127.0.0.1:8082:8082"
    volumes:
      - .:/workspace/arisback
      - aris_go_pkg:/go/pkg
      - aris_go_build:/root/.cache/go-build
    command: >
      sh -c "
      apk add --no-cache git netcat-openbsd &&
      go mod download &&
      go run ./cmd/user
      "

  post:
    profiles: ["microservices"]
    image: golang:alpine
    restart: unless-stopped
    working_dir: /workspace/arisback
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SSL_MODE: disable
      POOL_MAX_CONNS: ${POOL_MAX_CONNS}
      POOL_MAX_CONN_LIFETIME: ${POOL_MAX_CONN_LIFETIME}
      POOL_MAX_CONN_IDLE_TIME: ${POOL_MAX_CONN_IDLE_TIME}
      REDIS_DB: ${REDIS_DB}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD}
      REDIS_MAX_RETRIES: ${REDIS_MAX_RETRIES}
      REDIS_DIAL_TIMEOUT: ${REDIS_DIAL_TIMEOUT}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT}
      REDIS_ADDR: redis:6379
      USER_GRPC_ADDR: user:8004
      MEDIA_GRPC_ADDR: media:8003
      POST_GRPC_PORT: "8005"
      POST_HTTP_PORT: "8083"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8083 && nc -z 127.0.0.1 8005"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:8005:8005"
      - "127.0.0.1:8083:8083"
    volumes:
      - .:/workspace/arisback
      - aris_go_pkg:/go/pkg
      - aris_go_build:/root/.cache/go-build
    command: >
      sh -c "
      apk add --no-cache git netcat-openbsd &&
      go mod download &&
      go run ./cmd/post
      "

  chat:
    profiles: ["microservices"]
    image: golang:alpine
    restart: unless-stopped
    working_dir: /workspace/arisback
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SSL_MODE: disable
      POOL_MAX_CONNS: ${POOL_MAX_CONNS}
      POOL_MAX_CONN_LIFETIME: ${POOL_MAX_CONN_LIFETIME}
      POOL_MAX_CONN_IDLE_TIME: ${POOL_MAX_CONN_IDLE_TIME}
      REDIS_DB: ${REDIS_DB}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD}
      REDIS_MAX_RETRIES: ${REDIS_MAX_RETRIES}
      REDIS_DIAL_TIMEOUT: ${REDIS_DIAL_TIMEOUT}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT}
      REDIS_ADDR: redis:6379
      USER_GRPC_ADDR: user:8004
      CHAT_GRPC_PORT: "8006"
      CHAT_HTTP_PORT: "8084"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8084 && nc -z 127.0.0.1 8006"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:8006:8006"
      - "127.0.0.1:8084:8084"
    volumes:
      - .:/workspace/arisback
      - aris_go_pkg:/go/pkg
      - aris_go_build:/root/.cache/go-build
    command: >
      sh -c "
      apk add --no-cache git netcat-openbsd &&
      go mod download &&
      go run ./cmd/chat
      "

  support:
    profiles: ["microservices"]
    image: golang:alpine
    restart: unless-stopped
    working_dir: /workspace/arisback
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SSL_MODE: disable
      POOL_MAX_CONNS: ${POOL_MAX_CONNS}
      POOL_MAX_CONN_LIFETIME: ${POOL_MAX_CONN_LIFETIME}
      POOL_MAX_CONN_IDLE_TIME: ${POOL_MAX_CONN_IDLE_TIME}
      REDIS_DB: ${REDIS_DB}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD}
      REDIS_MAX_RETRIES: ${REDIS_MAX_RETRIES}
      REDIS_DIAL_TIMEOUT: ${REDIS_DIAL_TIMEOUT}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT}
      REDIS_ADDR: redis:6379
      MEDIA_GRPC_ADDR: media:8003
      SUPPORT_GRPC_PORT: ${SUPPORT_GRPC_PORT}
      SUPPORT_HTTP_PORT: ${SUPPORT_HTTP_PORT}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      media:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${SUPPORT_HTTP_PORT} && nc -z 127.0.0.1 ${SUPPORT_GRPC_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${SUPPORT_GRPC_PORT}:${SUPPORT_GRPC_PORT}"
      - "127.0.0.1:${SUPPORT_HTTP_PORT}:${SUPPORT_HTTP_PORT}"
    volumes:
      - .:/workspace/arisback
      - aris_go_pkg:/go/pkg
      - aris_go_build:/root/.cache/go-build
    command: >
      sh -c "
      apk add --no-cache git netcat-openbsd &&
      go mod download &&
      go run ./cmd/support
      "

  nginx:
    profiles: ["microservices"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      auth:
        condition: service_healthy
      media:
        condition: service_healthy
      user:
        condition: service_healthy
      post:
        condition: service_healthy
      chat:
        condition: service_healthy
      support:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:8080"
    volumes:
      - ./config/nginx.container.conf:/etc/nginx/nginx.conf:ro

  backend:
    image: golang:alpine
    restart: unless-stopped
    working_dir: /workspace/arisback
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SSL_MODE: disable
      POOL_MAX_CONNS: ${POOL_MAX_CONNS}
      POOL_MAX_CONN_LIFETIME: ${POOL_MAX_CONN_LIFETIME}
      POOL_MAX_CONN_IDLE_TIME: ${POOL_MAX_CONN_IDLE_TIME}
      MINIO_PORT: "9000"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_HOST: ${MINIO_HOST}
      MINIO_USE_SSL: "false"

      REDIS_CONTAINER_NAME: ${REDIS_CONTAINER_NAME}
      REDIS_DB: ${REDIS_DB}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PUBLIC_PORT: ${REDIS_PUBLIC_PORT}
      REDIS_MAX_RETRIES: ${REDIS_MAX_RETRIES}
      REDIS_DIAL_TIMEOUT: ${REDIS_DIAL_TIMEOUT}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT}
      REDIS_ADDR: ${REDIS_ADDR}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8080"
    volumes:
      - .:/workspace/arisback
      - aris_go_pkg:/go/pkg
      - aris_go_build:/root/.cache/go-build
    command: >
      sh -c "
      apk add --no-cache git netcat-openbsd &&
      go mod download &&
      go run ./cmd/main/main.go
      "

  frontend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /workspace/arisfront
    environment:
      BACKEND_URL: http://backend:8080
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3001"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:3001"
    volumes:
      - ../arisfront:/workspace/arisfront
      - aris_frontend_node_modules:/workspace/arisfront/node_modules
    command: >
      sh -lc "
      npm ci &&
      npm run dev -- --host 0.0.0.0 --port 3001
      "

volumes:
  aris_postgres_data:
  aris_minio_data:
  aris_go_bin:
  aris_go_pkg:
  aris_go_build:
  aris_frontend_node_modules:
  aris_redis_data:
