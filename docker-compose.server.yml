services:
  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1${NGINX_HEALTH_PATH:-/nginx-health} >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./config/nginx.container.server.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

  backend:
    profiles: ["local-monolith"]

  frontend:
    profiles: ["local-frontend"]
