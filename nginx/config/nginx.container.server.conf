worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_static on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    log_format aris_gateway '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for" '
        '$request_length $request_time $upstream_response_time "$upstream_status" "$upstream_addr"';

    access_log /var/log/nginx/access.log aris_gateway;

    upstream auth_service {
        zone auth_service 64k;
        server auth:8085 resolve;
        keepalive 32;
    }

    upstream media_service {
        zone media_service 64k;
        server media:8081 resolve;
        keepalive 32;
    }

    upstream user_service {
        zone user_service 64k;
        server user:8082 resolve;
        keepalive 32;
    }

    upstream post_service {
        zone post_service 64k;
        server post:8083 resolve;
        keepalive 32;
    }

    upstream chat_service {
        zone chat_service 64k;
        server chat:8084 resolve;
        keepalive 32;
    }

    upstream support_service {
        zone support_service 64k;
        server support:8086 resolve;
        keepalive 32;
    }

    upstream community_service {
        zone community_service 64k;
        server community:8087 resolve;
        keepalive 32;
    }

    upstream search_service {
        zone search_service 64k;
        server search:8088 resolve;
        keepalive 32;
    }

    upstream game_service {
        zone game_service 64k;
        server game:8089 resolve;
        keepalive 32;
    }

    upstream frontend_service {
        server host.docker.internal:3001;
        keepalive 32;
    }

    upstream grafana_service {
        server grafana:3000;
        keepalive 32;
    }

    upstream prometheus_service {
        server prometheus:9090;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name arisnet.ru www.arisnet.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location = /nginx-status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name arisnet.ru www.arisnet.ru;

        client_max_body_size 50m;

        ssl_certificate /etc/letsencrypt/live/arisnet.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/arisnet.ru/privkey.pem;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        root /var/www/arisfront;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location = /nginx-status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        location = /health {
            proxy_pass http://frontend_service;
        }

        location = /api/auth {
            proxy_pass http://auth_service;
        }

        location = /api/auth/password {
            proxy_pass http://auth_service;
        }

        location /api/auth/ {
            proxy_pass http://auth_service;
        }

        location = /api/public/popular-users {
            proxy_pass http://user_service;
        }

        location /api/users/ {
            proxy_pass http://user_service;
        }

        location /api/profile/ {
            proxy_pass http://user_service;
        }

        location /api/friends/ {
            proxy_pass http://user_service;
        }

        location /api/settings/ {
            proxy_pass http://user_service;
        }

        location = /api/public/feed {
            proxy_pass http://post_service;
        }

        location = /api/public/popular-posts {
            proxy_pass http://post_service;
        }

        location = /api/feed {
            proxy_pass http://post_service;
        }

        location = /api/feed/events {
            proxy_pass http://post_service;
        }

        location = /api/posts/popular {
            proxy_pass http://post_service;
        }

        location = /api/post {
            proxy_pass http://post_service;
        }

        location /api/post/ {
            proxy_pass http://post_service;
        }

        location = /api/media {
            proxy_pass http://media_service;
        }

        location /api/media/ {
            proxy_pass http://media_service;
        }

        location = /api/chats {
            proxy_pass http://chat_service;
        }

        location /api/chats/ {
            proxy_pass http://chat_service;
        }

        location /api/presence/ {
            proxy_pass http://chat_service;
        }

        location = /api/sticker-packs {
            proxy_pass http://chat_service;
        }

        location /api/sticker-packs/ {
            proxy_pass http://chat_service;
        }

        location = /api/support {
            proxy_pass http://support_service;
        }

        location /api/support/ {
            proxy_pass http://support_service;
        }

        location = /api/communities {
            proxy_pass http://community_service;
        }

        location /api/communities/ {
            proxy_pass http://community_service;
        }

        location = /api/search {
            proxy_pass http://search_service;
        }

        location = /api/games {
            proxy_pass http://game_service;
        }

        location ^~ /api/games/ {
            proxy_pass http://game_service;
        }

        location /ws/support/ {
            proxy_pass http://support_service;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Origin $http_origin;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location /ws/ {
            proxy_pass http://chat_service;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Origin $http_origin;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location ^~ /ws/games/ {
            proxy_pass http://game_service;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Origin $http_origin;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location /media/ {
            proxy_pass http://minio:9000/media/;
            proxy_http_version 1.1;
            proxy_set_header Host minio:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_redirect off;
        }

        location = /metrics {
            return 302 /metrics/;
        }

        location /metrics/ {
            proxy_pass http://grafana_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Prefix /metrics;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location = /prometheus {
            return 301 /prometheus/;
        }

        location /prometheus/ {
            proxy_pass http://prometheus_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Prefix /prometheus;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;

        }

        location ~* "^/(?:[^/]+\.[0-9a-f]{8,}\.(?:js|css)|assets/.*\.(?:css|png|jpg|jpeg|gif|svg|webp|ico|woff2?))$" {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /index.html {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        location = /offline.html {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        location = /sw.js {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        location = /asset-manifest.json {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        location = /manifest.webmanifest {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        location /api/ {
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
