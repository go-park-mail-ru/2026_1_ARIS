worker_processes auto;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    sendfile on;
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream auth_service {
        zone auth_service 64k;
        server auth:8085 resolve;
        keepalive 16;
    }

    upstream media_service {
        zone media_service 64k;
        server media:8081 resolve;
        keepalive 16;
    }

    upstream user_service {
        zone user_service 64k;
        server user:8082 resolve;
        keepalive 16;
    }

    upstream post_service {
        zone post_service 64k;
        server post:8083 resolve;
        keepalive 16;
    }

    upstream chat_service {
        zone chat_service 64k;
        server chat:8084 resolve;
        keepalive 16;
    }

    upstream support_service {
        zone support_service 64k;
        server support:8086 resolve;
        keepalive 16;
    }

    upstream community_service {
        zone community_service 64k;
        server community:8087 resolve;
        keepalive 16;
    }

    upstream search_service {
        zone search_service 64k;
        server search:8088 resolve;
        keepalive 16;
    }

    map $http_origin $cors_origin {
        default "";
        "http://localhost:3001" $http_origin;
        "http://127.0.0.1:3001" $http_origin;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 8080;
        server_name _;

        access_log /var/log/nginx/access.log;
        client_max_body_size 50m;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept, Authorization, Content-Type, X-Requested-With" always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        location = /health {
            access_log off;
            return 200 "ok\n";
        }

        location = /api/auth {
            proxy_pass http://auth_service;
        }

        location /api/auth/ {
            proxy_pass http://auth_service;
        }

        location = /api/public/popular-users {
            proxy_pass http://user_service;
        }

        location /api/users/ {
            proxy_pass http://user_service;
        }

        location /api/profile/ {
            proxy_pass http://user_service;
        }

        location /api/friends/ {
            proxy_pass http://user_service;
        }

        location /api/settings/ {
            proxy_pass http://user_service;
        }

        location = /api/public/feed {
            proxy_pass http://post_service;
        }

        location = /api/public/popular-posts {
            proxy_pass http://post_service;
        }

        location = /api/feed {
            proxy_pass http://post_service;
        }

        location = /api/posts/popular {
            proxy_pass http://post_service;
        }

        location = /api/post {
            proxy_pass http://post_service;
        }

        location /api/post/ {
            proxy_pass http://post_service;
        }

        location = /api/media {
            proxy_pass http://media_service;
        }

        location /api/media/ {
            proxy_pass http://media_service;
        }

        location = /api/chats {
            proxy_pass http://chat_service;
        }

        location /api/chats/ {
            proxy_pass http://chat_service;
        }

        location = /api/support {
            proxy_pass http://support_service;
        }

        location /api/support/ {
            proxy_pass http://support_service;
        }

        location = /api/communities {
            proxy_pass http://community_service;
        }

        location /api/communities/ {
            proxy_pass http://community_service;
        }

        location = /api/search {
            proxy_pass http://search_service;
        }

        location /ws/support/ {
            proxy_pass http://support_service;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Origin $http_origin;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location /ws/ {
            proxy_pass http://chat_service;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Origin $http_origin;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location /media/ {
            proxy_pass http://minio:9000/media/;
            proxy_http_version 1.1;
            proxy_set_header Host minio:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_redirect off;
        }

        location / {
            return 404;
        }
    }
}
