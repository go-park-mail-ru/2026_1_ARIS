syntax = "proto3";

package aris.user.v1;

option go_package = "github.com/go-park-mail-ru/2026_1_ARIS/proto/user;userpb";

service UserService {
    rpc CheckUsernameAvailable(CheckUsernameAvailableRequest) returns (CheckUsernameAvailableResponse);
    rpc CreateAuthUser(CreateAuthUserRequest) returns (AuthUserResponse);
    rpc GetCredentialsByLogin(GetCredentialsByLoginRequest) returns (GetCredentialsByLoginResponse);
    rpc GetAuthUserByAccount(GetAuthUserByAccountRequest) returns (AuthUserResponse);
    rpc GetProfileByUserAccount(GetProfileByUserAccountRequest) returns (GetProfileByUserAccountResponse);
    rpc GetUserProfileByUserAccount(GetUserProfileByUserAccountRequest) returns (GetUserProfileByUserAccountResponse);
    rpc GetProfileSummary(GetProfileSummaryRequest) returns (GetProfileSummaryResponse);
    rpc SearchProfiles(SearchProfilesRequest) returns (SearchProfilesResponse);
    rpc GetFriendProfileIDs(GetFriendProfileIDsRequest) returns (GetFriendProfileIDsResponse);
}

enum Gender {
    GENDER_UNSPECIFIED = 0;
    GENDER_MALE = 1;
    GENDER_FEMALE = 2;
}

message CheckUsernameAvailableRequest {
    string username = 1;
}

message CheckUsernameAvailableResponse {
    bool available = 1;
}

message CreateAuthUserRequest {
    string username = 1;
    string password_hash = 2;
    string first_name = 3;
    string last_name = 4;
    string birthday = 5;
    Gender gender = 6;
}

message GetCredentialsByLoginRequest {
    string login = 1;
}

message GetCredentialsByLoginResponse {
    int64 user_account_id = 1;
    string password_hash = 2;
}

message GetAuthUserByAccountRequest {
    int64 user_account_id = 1;
}

message AuthUserResponse {
    int64 user_account_id = 1;
    int64 user_profile_id = 2;
    int64 profile_id = 3;
    string login = 4;
    optional string email = 5;
    string first_name = 6;
    string last_name = 7;
    optional int64 avatar_id = 8;
    string created_at = 9;
}

message GetProfileByUserAccountRequest {
    int64 user_account_id = 1;
}

message GetProfileByUserAccountResponse {
    int64 profile_id = 1;
}

message GetUserProfileByUserAccountRequest {
    int64 user_account_id = 1;
}

message GetUserProfileByUserAccountResponse {
    int64 user_profile_id = 1;
}

message GetProfileSummaryRequest {
    int64 profile_id = 1;
}

message GetProfileSummaryResponse {
    int64 profile_id = 1;
    int64 user_account_id = 2;
    string first_name = 3;
    string last_name = 4;
    string username = 5;
    optional int64 avatar_id = 6;
}

message SearchProfilesRequest {
    string query = 1;
    int32 limit = 2;
}

message SearchProfileItem {
    int64 profile_id = 1;
    int64 user_account_id = 2;
    string username = 3;
    string first_name = 4;
    string last_name = 5;
    optional int64 avatar_id = 6;
}

message SearchProfilesResponse {
    repeated SearchProfileItem profiles = 1;
}

message GetFriendProfileIDsRequest {
    int64 user_account_id = 1;
}

message GetFriendProfileIDsResponse {
    repeated int64 profile_ids = 1;
}
