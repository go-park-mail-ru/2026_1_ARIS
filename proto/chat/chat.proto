syntax = "proto3";

package aris.chat.v1;

option go_package = "github.com/go-park-mail-ru/2026_1_ARIS/proto/chat;chatpb";

service ChatService {
  rpc CheckUserInChat(CheckUserInChatRequest) returns (CheckUserInChatResponse);
}

message CheckUserInChatRequest {
  int64 chat_id = 1;
  int64 user_account_id = 2;
}

message CheckUserInChatResponse {
  bool ok = 1;
}
