global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: aris-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth:8085
          - media:8081
          - user:8082
          - post:8083
          - chat:8084
          - support:8086
          - community:8087
          - search:8088
          - game:8089
