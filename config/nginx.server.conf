upstream aris_auth {
    server 127.0.0.1:8085;
    keepalive 32;
}

upstream aris_media {
    server 127.0.0.1:8081;
    keepalive 32;
}

upstream aris_user {
    server 127.0.0.1:8082;
    keepalive 32;
}

upstream aris_post {
    server 127.0.0.1:8083;
    keepalive 32;
}

upstream aris_chat {
    server 127.0.0.1:8084;
    keepalive 32;
}

map $arg_url $image_proxy_target {
    default $arg_url;
    "" "";
}

server {
    listen 80;
    listen [::]:80;
    server_name arisnet.ru www.arisnet.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arisnet.ru www.arisnet.ru;

    root /var/www/aris;
    index index.html;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/arisnet.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arisnet.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location = /api/auth {
        proxy_pass http://aris_auth;
    }

    location /api/auth/ {
        proxy_pass http://aris_auth;
    }

    location = /api/public/popular-users {
        proxy_pass http://aris_user;
    }

    location /api/users/ {
        proxy_pass http://aris_user;
    }

    location /api/profile/ {
        proxy_pass http://aris_user;
    }

    location /api/friends/ {
        proxy_pass http://aris_user;
    }

    location /api/settings/ {
        proxy_pass http://aris_user;
    }

    location = /api/media {
        proxy_pass http://aris_media;
    }

    location /api/media/ {
        proxy_pass http://aris_media;
    }

    location = /api/public/feed {
        proxy_pass http://aris_post;
    }

    location = /api/public/popular-posts {
        proxy_pass http://aris_post;
    }

    location = /api/feed {
        proxy_pass http://aris_post;
    }

    location = /api/posts/popular {
        proxy_pass http://aris_post;
    }

    location = /api/post {
        proxy_pass http://aris_post;
    }

    location /api/post/ {
        proxy_pass http://aris_post;
    }

    location = /api/chats {
        proxy_pass http://aris_chat;
    }

    location /api/chats/ {
        proxy_pass http://aris_chat;
    }

    location /ws/ {
        proxy_pass http://aris_chat;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:9000/media/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }

    location = /image-proxy {
        if ($image_proxy_target = "") {
            return 400;
        }

        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_pass $image_proxy_target;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }

    location ~* ^/(bundle\..*\.js|assets/.*\.(css|png|jpg|jpeg|gif|svg|webp|ico|woff2?))$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /asset-manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
