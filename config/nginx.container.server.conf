worker_processes auto;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    sendfile on;

    upstream auth_service {
        server auth:8085;
        keepalive 32;
    }

    upstream media_service {
        server media:8081;
        keepalive 32;
    }

    upstream user_service {
        server user:8082;
        keepalive 32;
    }

    upstream post_service {
        server post:8083;
        keepalive 32;
    }

    upstream chat_service {
        server chat:8084;
        keepalive 32;
    }

    upstream support_service {
        server support:8086;
        keepalive 32;
    }

    upstream frontend_service {
        server host.docker.internal:3001;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name arisnet.ru www.arisnet.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name arisnet.ru www.arisnet.ru;

        client_max_body_size 50m;

        ssl_certificate /etc/letsencrypt/live/arisnet.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/arisnet.ru/privkey.pem;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        location = /health {
            access_log off;
            return 200 "ok\n";
        }

        location = /api/auth {
            proxy_pass http://auth_service;
        }

        location /api/auth/ {
            proxy_pass http://auth_service;
        }

        location = /api/public/popular-users {
            proxy_pass http://user_service;
        }

        location /api/users/ {
            proxy_pass http://user_service;
        }

        location /api/profile/ {
            proxy_pass http://user_service;
        }

        location /api/friends/ {
            proxy_pass http://user_service;
        }

        location /api/settings/ {
            proxy_pass http://user_service;
        }

        location = /api/public/feed {
            proxy_pass http://post_service;
        }

        location = /api/public/popular-posts {
            proxy_pass http://post_service;
        }

        location = /api/feed {
            proxy_pass http://post_service;
        }

        location = /api/posts/popular {
            proxy_pass http://post_service;
        }

        location = /api/post {
            proxy_pass http://post_service;
        }

        location /api/post/ {
            proxy_pass http://post_service;
        }

        location = /api/media {
            proxy_pass http://media_service;
        }

        location /api/media/ {
            proxy_pass http://media_service;
        }

        location = /api/chats {
            proxy_pass http://chat_service;
        }

        location /api/chats/ {
            proxy_pass http://chat_service;
        }

        location = /api/support {
            proxy_pass http://support_service;
        }

        location /api/support/ {
            proxy_pass http://support_service;
        }

        location /ws/support/ {
            proxy_pass http://support_service;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Origin $http_origin;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location /ws/ {
            proxy_pass http://chat_service;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Origin $http_origin;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location /media/ {
            proxy_pass http://minio:9000/media/;
            proxy_http_version 1.1;
            proxy_set_header Host minio:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_redirect off;
        }

        location ~* ^/(bundle\..*\.js|assets/.*\.(css|png|jpg|jpeg|gif|svg|webp|ico|woff2?))$ {
            proxy_pass http://frontend_service;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /sw.js {
            proxy_pass http://frontend_service;
            add_header Cache-Control "no-cache";
        }

        location = /asset-manifest.json {
            proxy_pass http://frontend_service;
            add_header Cache-Control "no-cache";
        }

        location /api/ {
            return 404;
        }

        location / {
            proxy_pass http://frontend_service;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
