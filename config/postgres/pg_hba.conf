# Local socket access is used by container bootstrap and maintenance commands.
local all all trust

# Loopback access inside the container.
host all all 127.0.0.1/32 scram-sha-256
host all all ::1/128 scram-sha-256

# Docker bridge networks used by application containers, PgBouncer and exporters.
host all all 10.0.0.0/8 scram-sha-256
host all all 172.16.0.0/12 scram-sha-256
host all all 192.168.0.0/16 scram-sha-256
